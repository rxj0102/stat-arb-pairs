name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Rerun the study and confirm the committed results reproduce
        run: |
          python scripts/reproduce.py
          git diff --exit-code results/metrics.json results/daily_returns.csv results/periods.csv
        env:
          MPLBACKEND: Agg
      - run: python scripts/render_readme.py --check
