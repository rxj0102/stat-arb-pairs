[project]
name = "stat-arb-pairs"
version = "0.1.0"
description = "Does a cointegration screen find pairs worth trading? A rolling study on 61 years of industry returns"
requires-python = ">=3.11"
dependencies = [
    'pandas==2.2.3',
    'numpy==1.26.4',
    'scipy==1.13.1',
    'statsmodels==0.14.4',
    'matplotlib==3.9.4'
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false
